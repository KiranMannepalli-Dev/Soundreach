<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Dark rounded background -->
  <rect width="64" height="64" rx="14" fill="#0B0B0F"/>
  <!-- Six-pointed asterisk / snowflake star — 6 arms at 0°, 60°, 120°, 180°, 240°, 300° -->
  <!-- Each arm: a rounded thick rectangle rotated around center (32,32) -->
  <g transform="translate(32,32)">
    <!-- Arm 0° -->
    <rect x="-4" y="-22" width="8" height="22" rx="4" fill="#EF4444"/>
    <!-- Arm 60° -->
    <rect x="-4" y="-22" width="8" height="22" rx="4" fill="#EF4444" transform="rotate(60)"/>
    <!-- Arm 120° -->
    <rect x="-4" y="-22" width="8" height="22" rx="4" fill="#EF4444" transform="rotate(120)"/>
    <!-- Arm 180° -->
    <rect x="-4" y="-22" width="8" height="22" rx="4" fill="#EF4444" transform="rotate(180)"/>
    <!-- Arm 240° -->
    <rect x="-4" y="-22" width="8" height="22" rx="4" fill="#EF4444" transform="rotate(240)"/>
    <!-- Arm 300° -->
    <rect x="-4" y="-22" width="8" height="22" rx="4" fill="#EF4444" transform="rotate(300)"/>
    <!-- Centre dot -->
    <circle cx="0" cy="0" r="5" fill="#EF4444"/>
  </g>
</svg>